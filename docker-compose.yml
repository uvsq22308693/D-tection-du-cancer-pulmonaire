version: '3.8'
services:
  backend:
    build: .
    command: uvicorn fastapi_api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build: .
    command: streamlit run interface_cancer.py --server.port 8502 --server.headless true
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    depends_on:
      - backend